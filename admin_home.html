<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú lateral</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="layout">

    <!-- BARRA LATERAL -->
    <aside class="sidebar">

        <h2>Mi Menú</h2>

        <button onclick="mostrarContenido('inicio')">
            Inicio
        </button>

        <button onclick="mostrarContenido('perfil')">
            Perfil
        </button>

        <button onclick="mostrarContenido('configuracion')">
            Configuración
        </button>

        <button onclick="mostrarContenido('ayuda')">
            Ayuda
        </button>

    </aside>


    <!-- CONTENIDO -->
    <main class="content">

        <section id="inicio" class="pagina">
            <h1>Inicio</h1>
            <p>Bienvenido al menú principal.</p>
        </section>

        <section id="perfil" class="pagina">
            <h1>Perfil</h1>
            <p>Aquí aparecerá la información del perfil.</p>
        </section>

        <section id="configuracion" class="pagina">
            <h1>Configuración</h1>
            <p>Aquí podrás modificar la configuración.</p>
        </section>

        <section id="ayuda" class="pagina">
            <h1>Ayuda</h1>
            <p>Aquí aparecerá la información de ayuda.</p>
        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
