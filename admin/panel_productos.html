<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel de productos</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

    <div class="diseno_barra_lateral">

        <aside class="barralateral">
            <h2 class="titulo_bl">La Créme De La Créme</h2>

            <nav>
                <a href="admin_home.html" class="boton_menu">🏠 Inicio</a>
                <a href="panel_productos.html" class="boton_menu">🍰 Productos</a>
                <a href="panel_pedidos.html" class="boton_menu">📦 Pedidos</a>
                <a href="panel_clientes.html" class="boton_menu">👤 Clientes</a>
                <a href="panel_config.html" class="boton_menu">⚙️ Configuración</a>
                <a href="../index.html" class="boton_pag_principal">&lt;- Volver a la tienda</a>
            </nav>

        </aside>


        <main class="diseno_contenido_principal">
            <p class="titulo_seccion">Administración / Productos</p>
            <h1 class="titulo_seccion">Panel Administrativo</h1>

            <div class="encabezado_opcion">

                <div>
                    <p class="bold">Catálogo de productos</p>
                    <p class="textgris">Administra los productos disponibles en la tienda.</p>
                </div>

                <button type="button" id="btnAgregarProducto" class="boton_principal">+ Agregar producto</button>
            </div>


            <div id="formularioProducto" style="display: none;">
                <h2>Agregar producto</h2>
                <form id="formProducto">

                    <label for="nombreProducto">Nombre:</label>
                    <input type="text" id="nombreProducto">

                    <label for="categoriaProducto">Categoría:</label>
                    <input type="text" id="categoriaProducto">

                    <label for="precioProducto">Precio:</label>
                    <input type="number" id="precioProducto">

                    <label for="stockProducto">Stock:</label>
                    <input type="number" id="stockProducto">

                    <p id="mensajeError"></p>

                    <button type="submit" class="boton_principal">
                        Guardar producto
                    </button>

                </form>

            </div>


            <div class="contenedor_tabla">

                <div class="fila_tabla encabezado_tabla">
                    <p>Producto</p>
                    <p>Categoría</p>
                    <p>Precio</p>
                    <p>Stock</p>
                    <p>Estado</p>
                    <p>Acciones</p>
                </div>

                <div id="listaProductos"></div>

            </div>

        </main>

    </div>


    <script src="../js/admin.js"></script>

</body>

</html>
